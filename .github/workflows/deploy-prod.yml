name: CI/CD - IaEditais

on:
  push:
    branches: ["develop-v3.x"]

jobs:

  # ==============================
  # 🚦 CI — testa o projeto
  # ==============================
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Instalar dependências
        run: npm install

      - name: Rodar build para validar
        run: npm run build

      # Se quiser adicionar testes depois:
      # - name: Rodar testes
      #   run: npm run test

  # ==============================
  # 🚀 CD — só roda SE o CI PASSAR
  # ==============================
  cd:
    needs: ci  # 👈 obrigatório: só continua se o job 'ci' passar
    runs-on: ubuntu-latest

    steps:

    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar chave SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.IA_EDITAIS_SSH }}

    - name: Deploy no servidor via SSH
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.IP_HOST_IAEDITAIS }} << 'EOF'
          set -e

          echo "🚀 Iniciando deploy via docker-compose..."

          cd /home/ubuntu/apps/prod/v3

          if [ ! -d "iaEditais-front" ]; then
            git clone -b develop-v3.x https://github.com/rafaelontour/ia_editais_fiocruz.git iaEditais-front-v3
            cd iaEditais-front-v3
          else
            cd iaEditais-front-v3
            git fetch origin develop-v3.x
            git reset --hard origin/develop-v3.x
          fi

          export DOCKER_BUILDKIT=1

          docker compose down --rmi all --remove-orphans || true
          docker compose up -d --build

          echo "✅ Deploy concluído com sucesso!"
        EOF
